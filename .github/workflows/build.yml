on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false # Failure on one system leaves the other running
      matrix:
        include:
          - os: ubuntu-latest
            package: aarch64-darwin-cross
          - os: macos-latest
            package: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check
      - run: nix build && tar -cf scrollreversed-${{ matrix.package }}.tar -C result . # Tar keeps the modes that artifacts lose
      - uses: actions/upload-artifact@main
        with:
          path: scrollreversed-${{ matrix.package }}.tar
          archive: false
